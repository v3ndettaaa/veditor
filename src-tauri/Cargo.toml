[package]
name = "veditor"
version = "2.0.0"
description = "Veditor - Fast, beautiful PDF editor and annotator"
authors = ["v3ndettaaa"]
edition = "2021"

[lib]
name = "veditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binaries for distribution.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
