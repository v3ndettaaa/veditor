<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>veditor</title>
  <link rel="stylesheet" href="src/ui/styles/tokens.css">
  <link rel="stylesheet" href="src/ui/styles/components.css">
  <link rel="stylesheet" href="src/popup/popup.css">
</head>
<body class="theme-dark">
  <div class="popup-header">
    <div class="popup-logo">
      <img src="icons/icon-32.png" alt="veditor" class="logo-icon">
      <span class="popup-title">veditor</span>
    </div>
    <span class="popup-badge">v1.0</span>
  </div>

  <div class="popup-actions">
    <button id="open-app-btn" class="primary-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open Full Editor
    </button>

    <button id="open-file-btn" class="secondary-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12"></line>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      Open PDF File...
    </button>
  </div>
  <input type="file" id="file-input" accept="application/pdf" style="display: none;">

  <div class="section-label">Recent Documents</div>
  <ul id="recent-list" class="recent-list">
    <div class="empty-state">Loading...</div>
  </ul>

  <div class="popup-footer">
    <span id="shortcuts-link" class="footer-link" role="button" tabindex="0">Shortcuts (?)</span>
    <span class="popup-privacy">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
      100% Offline &amp; Private
    </span>
  </div>

  <script type="module" src="src/popup/popup.ts"></script>
</body>
</html>
