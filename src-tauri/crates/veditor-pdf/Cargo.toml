[package]
name = "veditor-pdf"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VEditor PDF backend integration (MuPDF target)"

[dependencies]
veditor-core = { path = "../veditor-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Real MuPDF backend, optional so default builds need no native toolchain.
# Enable with `--features mupdf` once libclang is available (see lib.rs docs).
mupdf = { version = "0.8", optional = true }

[features]
mupdf = ["dep:mupdf"]

[dev-dependencies]
# PNG decode for the headless pixel-proof test only (pure Rust, no native deps).
image = "0.25"
