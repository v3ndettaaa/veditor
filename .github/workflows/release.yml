name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which builds to run'
        type: choice
        default: all
        options:
          - all
          - electron-only

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg_version.outputs.VERSION }}
      tag: ${{ steps.pkg_version.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version & ensure GitHub Release exists
        id: pkg_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('./package.json', 'utf8')).version);")
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" --target "$GITHUB_SHA" --title "veditor $TAG" --notes "See the assets below to download and install veditor for Windows, macOS, Linux (Tauri & Electron), Chrome & Firefox."
          fi

  build-electron-linux:
    needs: prepare-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build desktop frontend bundle
        run: npm run build:desktop

      - name: Install Electron packaging dependencies
        run: npm --prefix electron install

      - name: Build Electron Linux packages (AppImage & deb)
        run: npm --prefix electron run build:linux

      - name: Upload Linux Electron packages to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          TAG="${{ needs.prepare-release.outputs.tag }}"
          ASSETS=(dist/electron/*electron*.AppImage dist/electron/*electron*.deb)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No Electron Linux artifacts found in dist/electron!"
            ls -la dist/electron || true
            exit 1
          fi
          echo "Uploading Electron Linux artifacts to release $TAG with --clobber:"
          printf '  - %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

  build-tauri:
    needs: prepare-release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils desktop-file-utils libfuse2

      - name: Install frontend dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
        with:
          tagName: v__VERSION__
          releaseName: 'veditor v__VERSION__'
          releaseBody: 'See the assets below to download and install veditor for Windows, macOS, Linux, Chrome & Firefox.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  package-extensions:
    needs: prepare-release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Package browser extensions
        run: npm run package

      - name: Upload extension zips to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          echo "Uploading extension archives to release $TAG with --clobber..."
          gh release upload "$TAG" dist/veditor-chrome.zip dist/veditor-firefox.zip --clobber




